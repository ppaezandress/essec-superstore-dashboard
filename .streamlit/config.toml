# Design system: "Data-Dense Dashboard" (ui-ux-pro-max) + dataviz status/series colours
[theme]
base = "light"
primaryColor = "#1E40AF"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#0F172A"
font = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
headingFont = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
borderColor = "#DCE3EC"
baseRadius = "medium"
showWidgetBorder = true

[server]
headless = true
